# ============================================================
#  Suivi Chantier — Configuration Nginx (Contabo VPS Ubuntu)
#  Sert l'admin (SPA statique) ET proxifie l'API sur LE MÊME domaine.
#  Remplacer : YOUR_DOMAIN par votre vrai domaine
#              ex: app.suivie-chantier.com
#  Déposer dans : /etc/nginx/sites-available/suivie-chantier
#  Activer via  : ln -sf /etc/nginx/sites-available/suivie-chantier \
#                        /etc/nginx/sites-enabled/suivie-chantier
#
# ── Choix d'architecture (audit — Admin §1) ─────────────────────────────────
# Avant ce correctif, ce fichier ne faisait QUE proxifier vers l'API — rien
# ne servait jamais le build de l'admin, et aucun autre fichier du dépôt ne
# documentait comment il était censé arriver en production. Le seul indice
# existant était `admin/.env` : `VITE_API_BASE_URL=/api/v1`, un chemin
# RELATIF — ce qui n'a de sens QUE si l'admin et l'API partagent la même
# origine. C'est le choix retenu ici : un seul domaine, l'admin servi en
# statique à la racine, l'API proxifiée sous /api/ et /uploads/.
#
# Si vous vouliez en réalité deux domaines séparés (ex: api.xxx pour le
# backend, app.xxx pour l'admin), gardez ce fichier tel quel pour l'API
# (remettez `location /` en proxy pur, comme avant) et servez l'admin depuis
# un second server{} — dites-le et on l'adapte.
# ============================================================

# Upstream Node.js (facilite les changements de port)
upstream suivie_chantier_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── Redirection HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Certbot ACME challenge (renouvellement automatique)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Serveur HTTPS principal ───────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    # ── Certificats Let's Encrypt (générés par Certbot) ──────────────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── TLS durci ─────────────────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP Stapling
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    # ── Headers sécurité ─────────────────────────────────────────────────────
    # X-XSS-Protection est retiré (obsolète et contre-productif sur les navigateurs modernes).
    server_tokens   off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "DENY"                                         always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self), payment=(), usb=(), fullscreen=()" always;

    # ── Taille max des uploads (Multer 5 MB + marge) ─────────────────────────
    client_max_body_size  10M;
    client_body_timeout   30s;
    client_header_timeout 10s;
    send_timeout          30s;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   4;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/xml;

    # ── Health check direct (pas de log) ─────────────────────────────────────
    location = /health {
        access_log off;
        proxy_pass         http://suivie_chantier_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
    }

    # ── API Node.js (préfixe /api/ — voir VITE_API_BASE_URL=/api/v1 côté admin) ─
    location /api/ {
        proxy_pass         http://suivie_chantier_backend;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Headers transmis à Express (nécessaires pour trust proxy + IP réelle)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Désactiver le buffering pour les réponses longues (PDF, exports)
        proxy_buffering    off;
        proxy_buffer_size  4k;
    }

    # ── Fichiers privés (plans, documents, photos — contrôle d'accès côté API) ──
    # Même middleware chain que /api/ (auth + checkFileAccess côté Express) :
    # voir backend/src/app.js. Doit rester un simple proxy, jamais du `root`
    # statique nginx — l'autorisation se décide dans le backend, pas ici.
    location /uploads/ {
        proxy_pass         http://suivie_chantier_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering    off;
    }

    # ── Admin (SPA statique) ────────────────────────────────────────────────────
    # Build déposé par admin/.github/workflows/deploy.yml (voir ce fichier).
    # `try_files ... /index.html` : toute route React Router inconnue de nginx
    # (ex: /organisation/membres) retombe sur index.html, laissant le routeur
    # côté client décider — sans ça, un rechargement de page sur une route
    # profonde renvoie un 404 nginx au lieu de l'app.
    root /var/www/suivie-chantier-admin/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # index.html ne doit JAMAIS être mis en cache (sinon un déploiement
        # n'est visible qu'après un vidage de cache manuel côté client) — les
        # assets versionnés (hash dans le nom de fichier, voir Vite) le sont.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/suivie-chantier-access.log combined;
    error_log  /var/log/nginx/suivie-chantier-error.log warn;
}

# ── Map nécessaire pour WebSocket upgrade ─────────────────────────────────────
# (À placer dans /etc/nginx/nginx.conf → section http{} ou dans un fichier conf.d/)
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
