# ============================================================
#  Suivi Chantier — Nginx pour l'admin (SPA statique React/Vite)
#  Domaine dédié à l'admin — ex: app.widjila.com
#  L'API est un DOMAINE SÉPARÉ, voir deploy/nginx.conf (ex: api.widjila.com).
#
#  Remplacer : YOUR_DOMAIN par votre domaine admin réel (ex: app.widjila.com)
#  Déposer dans : /etc/nginx/sites-available/suivie-chantier-admin
#  Activer via  : ln -sf /etc/nginx/sites-available/suivie-chantier-admin \
#                        /etc/nginx/sites-enabled/suivie-chantier-admin
#
#  Le build (admin/dist) est déposé par admin/.github/workflows/deploy.yml
#  dans /var/www/suivie-chantier-admin/dist — ce fichier ne fait QUE servir
#  ces fichiers statiques, il ne proxifie jamais vers l'API (l'admin appelle
#  l'API directement en cross-origin via VITE_API_BASE_URL, voir admin/.env).
# ============================================================

# ── Redirection HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Certbot ACME challenge (renouvellement automatique)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Serveur HTTPS principal ───────────────────────────────────────────────────
server {
    # Syntaxe combinée (pas `http2 on;` séparé) : compatible avec nginx < 1.25.1,
    # la version installée par `apt` sur Ubuntu 22.04 (1.18) et 24.04 (1.24).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # ── Certificats Let's Encrypt (générés par Certbot) ──────────────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── TLS durci ─────────────────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP Stapling
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    # ── Headers sécurité ─────────────────────────────────────────────────────
    # CSP : connect-src doit inclure le domaine API (cross-origin) pour que
    # fetch/XHR/WebSocket vers api.widjila.com ne soient pas bloqués par le
    # navigateur. Adaptez si vous ajoutez Sentry (connect-src) ou une autre
    # origine tierce (ex: Stripe.js → script-src/frame-src).
    server_tokens   off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "DENY"                                         always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self), payment=(), usb=(), fullscreen=()" always;
    add_header Content-Security-Policy   "default-src 'self'; connect-src 'self' https://YOUR_API_DOMAIN https://*.sentry.io; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'" always;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   4;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        image/svg+xml;

    # ── SPA statique ─────────────────────────────────────────────────────────
    # `try_files ... /index.html` : toute route React Router inconnue de nginx
    # (ex: /organisation/membres) retombe sur index.html, laissant le routeur
    # côté client décider — sans ça, un rechargement de page sur une route
    # profonde renvoie un 404 nginx au lieu de l'app.
    root /var/www/suivie-chantier-admin/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html ne doit JAMAIS être mis en cache (sinon un déploiement n'est
    # visible qu'après un vidage de cache manuel côté client) — les assets
    # versionnés (hash dans le nom de fichier, voir Vite) le sont, eux.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/suivie-chantier-admin-access.log combined;
    error_log  /var/log/nginx/suivie-chantier-admin-error.log warn;
}
