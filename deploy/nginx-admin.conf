# ============================================================
#  Suivi Chantier — Nginx pour l'admin (SPA statique React/Vite)
#  Domaine dédié à l'admin — ex: app.widjila.com
#  L'API est un DOMAINE SÉPARÉ, voir deploy/nginx.conf (ex: api.widjila.com).
#
#  Remplacer : YOUR_DOMAIN par votre domaine admin réel (ex: app.widjila.com)
#  Déposer dans : /etc/nginx/sites-available/suivie-chantier-admin
#  Activer via  : ln -sf /etc/nginx/sites-available/suivie-chantier-admin \
#                        /etc/nginx/sites-enabled/suivie-chantier-admin
#
#  Le build (admin/dist) est déposé par admin/.github/workflows/deploy.yml
#  dans /var/www/suivie-chantier-admin/dist — ce fichier ne fait QUE servir
#  ces fichiers statiques, il ne proxifie jamais vers l'API (l'admin appelle
#  l'API directement en cross-origin via VITE_API_BASE_URL, voir admin/.env).
# ============================================================

# ── Redirection HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Certbot ACME challenge (renouvellement automatique)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Serveur HTTPS principal ───────────────────────────────────────────────────
server {
    # Syntaxe combinée (pas `http2 on;` séparé) : compatible avec nginx < 1.25.1,
    # la version installée par `apt` sur Ubuntu 22.04 (1.18) et 24.04 (1.24).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # ── Certificats Let's Encrypt (générés par Certbot) ──────────────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    # options-ssl-nginx.conf fixe déjà ssl_protocols, ssl_prefer_server_ciphers,
    # ssl_session_cache/timeout/tickets et ssl_ciphers (boilerplate standard
    # Certbot) — NE PAS les redéclarer ici, nginx refuse de démarrer sur une
    # directive dupliquée ("ssl_prefer_server_ciphers is duplicate").
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # OCSP Stapling
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    # ── Headers sécurité ─────────────────────────────────────────────────────
    #
    # CSP : `connect-src` doit inclure le domaine API (cross-origin), sans quoi
    # le navigateur bloque tous les appels vers api.widjila.com.
    #
    # ── STRIPE ────────────────────────────────────────────────────────────────
    # Le paiement par carte NE FONCTIONNE PAS sans les trois directives
    # ci-dessous. Stripe Elements charge son script depuis js.stripe.com et
    # rend le champ de carte dans une iframe : avec `script-src 'self'` seul et
    # aucun `frame-src`, le script est refusé et le formulaire ne s'affiche
    # jamais. Le symptôme est un encart vide, sans erreur visible ailleurs que
    # dans la console du navigateur.
    #
    # Domaines repris de la documentation Stripe (Integration security guide,
    # section Content Security Policy → Stripe.js) :
    #   script-src  : js.stripe.com, *.js.stripe.com
    #   frame-src   : js.stripe.com, *.js.stripe.com, hooks.stripe.com
    #                 (hooks.stripe.com sert les redirections 3D Secure)
    #   connect-src : api.stripe.com
    #
    # ── pdf.js ────────────────────────────────────────────────────────────────
    # `script-src` reste limité aux origines listées, JAMAIS 'unsafe-inline' ni
    # 'unsafe-eval'. C'est la seconde parade documentée contre GHSA-hq66-cqwq-w95j
    # (exécution de JavaScript embarqué dans un PDF téléversé) ; la première est
    # `enableScripting: false`, posée dans src/components/plan/pdfWorker.js.
    # Élargir cette directive rouvrirait la faille.
    server_tokens   off;
    #
    # ── HÉRITAGE add_header — CORRECTIF (audit sécurité) ──────────────────────
    # nginx n'hérite les `add_header` du niveau `server` QUE dans les blocs
    # `location` qui n'en déclarent aucun. Or `location = /index.html` pose
    # `Cache-Control` : il perdait donc TOUS les en-têtes ci-dessous. Et comme
    # `location /` renvoie chaque route de l'application vers `/index.html`
    # (`try_files`), la page HTML — la seule que la CSP protège — partait sans
    # CSP, sans HSTS, sans X-Frame-Options, sans nosniff. La CSP n'a jamais été
    # appliquée en production, et l'application pouvait être encadrée
    # (clickjacking). Tout bloc `location` qui ajoute un en-tête doit répéter
    # ceux-ci : c'est ce que vérifie nginx.enTetesSecurite.test.js.
    #
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "DENY"                                         always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self), payment=(), usb=(), fullscreen=()" always;
    # CSP — CORRECTIF (audit sécurité) :
    #
    #  - `blob:` manquait dans `img-src` et `frame-src`. Tous les aperçus de
    #    fichiers PRIVÉS passent par une URL `blob:` (le fichier est chargé avec
    #    la session, puis affiché) — or `'self'` ne couvre PAS le schéma
    #    `blob:`. En production, les aperçus de plans, de documents, de rapports
    #    et les photos de réserves étaient donc bloqués par le navigateur ;
    #    invisible en développement, où aucune CSP ne s'applique.
    #  - `media-src` absent : les vidéos et notes vocales de réserve, lues en
    #    `blob:`, retombaient sur `default-src 'self'` et étaient bloquées.
    #  - `base-uri 'self'` : sans lui, une balise `<base>` injectée réécrirait
    #    la destination de toutes les URL relatives de la page.
    #  - `object-src 'none'` : aucun plugin (`<object>`, `<embed>`) n'a de raison
    #    d'exister ici.
    #  - `form-action 'self'` : aucun formulaire ne soumet vers un autre domaine
    #    (Stripe opère dans sa propre iframe).
    #  - `upgrade-insecure-requests` : aucune ressource ne part en HTTP clair.
    #
    # `img-src` garde `https:` : les photos de profil et logos sont servis par
    # le CDN public du stockage (`storage.service.js#DOSSIERS_PUBLICS`), dont le
    # domaine dépend de la configuration R2 de chaque installation.
    add_header Content-Security-Policy   "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; connect-src 'self' https://YOUR_API_DOMAIN https://*.sentry.io https://api.stripe.com; img-src 'self' data: blob: https:; media-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' https://js.stripe.com https://*.js.stripe.com; frame-src 'self' blob: https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com; worker-src 'self' blob:; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   4;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        image/svg+xml;

    # ── SPA statique ─────────────────────────────────────────────────────────
    # `try_files ... /index.html` : toute route React Router inconnue de nginx
    # (ex: /organisation/membres) retombe sur index.html, laissant le routeur
    # côté client décider — sans ça, un rechargement de page sur une route
    # profonde renvoie un 404 nginx au lieu de l'app.
    root /var/www/suivie-chantier-admin/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html ne doit JAMAIS être mis en cache (sinon un déploiement n'est
    # visible qu'après un vidage de cache manuel côté client) — les assets
    # versionnés (hash dans le nom de fichier, voir Vite) le sont, eux.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";

        # HÉRITAGE add_header — voir le commentaire au niveau `server`.
        # Ce bloc pose son propre en-tête : nginx n'hérite alors PLUS aucun
        # `add_header` du niveau supérieur. Les en-têtes de sécurité sont donc
        # répétés ici, à l'identique (vérifié par
        # backend/src/__tests__/nginx.enTetesSecurite.test.js).
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "DENY"                                         always;
        add_header X-Content-Type-Options    "nosniff"                                      always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self), payment=(), usb=(), fullscreen=()" always;
        add_header Content-Security-Policy   "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; connect-src 'self' https://YOUR_API_DOMAIN https://*.sentry.io https://api.stripe.com; img-src 'self' data: blob: https:; media-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' https://js.stripe.com https://*.js.stripe.com; frame-src 'self' blob: https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com; worker-src 'self' blob:; frame-ancestors 'none'; upgrade-insecure-requests" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # HÉRITAGE add_header — voir le commentaire au niveau `server`.
        # Ce bloc pose son propre en-tête : nginx n'hérite alors PLUS aucun
        # `add_header` du niveau supérieur. Les en-têtes de sécurité sont donc
        # répétés ici, à l'identique (vérifié par
        # backend/src/__tests__/nginx.enTetesSecurite.test.js).
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "DENY"                                         always;
        add_header X-Content-Type-Options    "nosniff"                                      always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self), payment=(), usb=(), fullscreen=()" always;
        add_header Content-Security-Policy   "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; connect-src 'self' https://YOUR_API_DOMAIN https://*.sentry.io https://api.stripe.com; img-src 'self' data: blob: https:; media-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' https://js.stripe.com https://*.js.stripe.com; frame-src 'self' blob: https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com; worker-src 'self' blob:; frame-ancestors 'none'; upgrade-insecure-requests" always;
    }

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/suivie-chantier-admin-access.log combined;
    error_log  /var/log/nginx/suivie-chantier-admin-error.log warn;
}
